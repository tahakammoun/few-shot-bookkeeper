<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Pipeline diagram: raw documents are extracted and aggregated into real numbers, while worked examples drive a few-shot draft with placeholder tokens; both paths converge at Inject, then Check, then Render PDF, then human review and approval.">
  <rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2332"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d54a8"/>
    </marker>
  </defs>

  <text x="16" y="16" font-size="12" font-weight="700" fill="#1e3a5f" font-family="Arial, Helvetica, sans-serif">NUMBERS</text>
  <text x="16" y="146" font-size="12" font-weight="700" fill="#6d54a8" font-family="Arial, Helvetica, sans-serif">STRUCTURE</text>
  <text x="250" y="276" font-size="12" font-weight="700" fill="#1a2332" font-family="Arial, Helvetica, sans-serif">MERGED</text>

  <!-- Row 1: Numbers -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="16" y="30" width="190" height="60" rx="8" fill="#e7edf5" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="111" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Raw documents</text>

    <rect x="236" y="30" width="210" height="60" rx="8" fill="#e7edf5" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="341" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Extract + aggregate</text>

    <rect x="476" y="30" width="180" height="60" rx="8" fill="#e7edf5" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="566" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Real numbers</text>
  </g>
  <line x1="206" y1="60" x2="230" y2="60" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
  <line x1="446" y1="60" x2="470" y2="60" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrow-navy)"/>

  <!-- Row 2: Structure -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="16" y="150" width="220" height="60" rx="8" fill="#efeaf9" stroke="#6d54a8" stroke-width="1.5"/>
    <text x="126" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Worked examples</text>
    <text x="126" y="192" text-anchor="middle" font-size="11" fill="#66707f">client_b + client_c</text>

    <rect x="266" y="150" width="190" height="60" rx="8" fill="#efeaf9" stroke="#6d54a8" stroke-width="1.5"/>
    <text x="361" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Few-shot draft</text>
    <text x="361" y="192" text-anchor="middle" font-size="11" fill="#66707f">Gemini</text>

    <rect x="486" y="150" width="220" height="60" rx="8" fill="#efeaf9" stroke="#6d54a8" stroke-width="1.5"/>
    <text x="596" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Draft with placeholders</text>
  </g>
  <line x1="236" y1="180" x2="260" y2="180" stroke="#6d54a8" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="456" y1="180" x2="480" y2="180" stroke="#6d54a8" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- convergence -->
  <path d="M 566,90 V 250 H 280 V 290" fill="none" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
  <path d="M 596,210 V 265 H 340 V 290" fill="none" stroke="#6d54a8" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- Row 3: Merged -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="240" y="290" width="130" height="60" rx="8" fill="#e7edf5" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="305" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Inject</text>

    <rect x="400" y="290" width="130" height="60" rx="8" fill="#e7edf5" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="465" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Check</text>

    <rect x="560" y="290" width="140" height="60" rx="8" fill="#e7edf5" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="630" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Render PDF</text>

    <rect x="730" y="290" width="240" height="60" rx="8" fill="#e5f3ec" stroke="#257a52" stroke-width="1.5"/>
    <text x="850" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">Human review</text>
    <text x="850" y="334" text-anchor="middle" font-size="11" fill="#66707f">named approval required</text>
  </g>
  <line x1="370" y1="320" x2="394" y2="320" stroke="#1a2332" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="320" x2="554" y2="320" stroke="#1a2332" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="320" x2="724" y2="320" stroke="#1a2332" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
